[project]
name = "warheads-scripts"
version = "0.1.0"
description = "data fetching and organizing scripts for NBA betting data. used in warheads"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "pandas>=3.0.6",
    "python-dotenv>=1.1.1",
    "requests>=2.34.2",
]

[dependency-groups]
dev = ["pytest>=9.1.1"]

[project.scripts]
whs-fetch = "warheads_scripts.query:main"
whs-parse = "warheads_scripts.process_odds:main"
whs-export = "warheads_scripts.agg:main"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/warheads_scripts/__init__.py"
